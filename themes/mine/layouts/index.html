{{ define "main" }}
{{/* One narrow column of sections separated by thin lines, after niladridutt.com */}}
<main class="page">
    <section class="hero" id="about">
        {{ partial "about.html" . }}
    </section>

    <section id="news">
        {{ partial "news.html" . }}
    </section>

    <section id="publications">
        {{ partial "pubs.html" . }}
    </section>

    {{ with .Params.service }}
    <section id="service">
        {{ partial "service.html" $ }}
    </section>
    {{ end }}
</main>
{{ end }}
