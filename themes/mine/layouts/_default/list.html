{{ define "main" }}

<div>
    <h1>{{ .Title }}</h1>
</div>
<div>
    {{ range .Pages }}
    <div>
        <h2>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>
        <div class="article-style">
            {{ .Params.description }}
        </div>
    </div>
    {{ end }}
</div>

{{ end }}
