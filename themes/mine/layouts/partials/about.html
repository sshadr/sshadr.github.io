<div class="hero-grid">
    <div class="hero-photo">
        <img class="avatar" src="{{ .Site.Data.admin.author.picture }}" alt="Portrait of {{ .Params.title }}"
            width="400" height="400">
    </div>

    <div class="hero-text">
        <div class="glass-panel name-panel">
            <h1 class="name">{{ .Params.title | safeHTML }}</h1>

            {{ with .Params.tagline }}
            <p class="tagline eq">
                <span aria-hidden="true">{{ . | safeHTML }}</span>
                {{ with $.Params.tagline_alt }}<span class="sr-only">{{ . }}</span>{{ end }}
            </p>
            {{ end }}
        </div>

        <div class="lede">
            {{ .Content }}
        </div>

        {{ with .Params.organizations.previous }}
        <div class="glass-panel past-panel">
            <span class="past-label">Previously</span>
            <ul class="past-logos">
                {{ range . }}
                <li>
                    <a href="{{ .url }}" target="_blank" rel="noopener" title="{{ .name }}">
                        <img src="{{ .image }}" alt="{{ .name }}" height="26">
                    </a>
                </li>
                {{ end }}
            </ul>
        </div>
        {{ end }}

        <div class="links" aria-label="Profiles and links">
            {{ range .Params.social }}
            <a class="link-btn" href="{{ .link }}" target="_blank" rel="noopener">
                <i class="{{ if eq .icon_pack "ai" }}ai ai-{{ .icon }}{{ else }}{{ .icon_pack }} fa-{{ .icon }}{{ end }}"
                    aria-hidden="true"></i>
                {{ .label }}
            </a>
            {{ end }}
        </div>
    </div>
</div>
